<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Audio/Video Splitter</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">
  <style>body{padding:2rem}</style>
</head>
<body>
  <div class="container" style="max-width:500px">
    <h2 class="mb-4">Split Audio/Video</h2>
    {% with msgs = get_flashed_messages() %}
      {% if msgs %}
        <div class="alert alert-warning">{{ msgs[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">File</label>
        <input type="file" name="file" class="form-control" required>
      </div>
      <div class="mb-3 d-flex align-items-center gap-2">
        <input type="number" name="duration" min="0.1" step="0.1" value="20" class="form-control" style="max-width:100px">
        <label>min per chunk</label>
      </div>
      <div class="mb-3 d-flex align-items-center gap-2">
        <input type="number" name="num_chunks" min="1" step="1" class="form-control" style="max-width:100px">
        <label>OR # of chunks</label>
      </div>
      <button class="btn btn-primary w-100">Split &amp; Upload</button>
    </form>
  </div>
</body>
</html>
