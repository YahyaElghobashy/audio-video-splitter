<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Split Complete</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">
  <style>body{padding:2rem}</style>
</head>
<body>
  <div class="container" style="max-width:600px">
    <h2>✅ Split Complete</h2>
    <p>Folder: <code>{{ folder }}</code></p>
    <p>Created <strong>{{ parts|length }}</strong> chunks.</p>
    <p>
      <a href="{{ url_for('download', folder=folder, filename=zip_name) }}" 
         class="btn btn-success">
        Download All as ZIP
      </a>
    </p>
    <h5>Individual files:</h5>
    <ul>
      {% for f in parts %}
        <li>
          <a href="{{ url_for('download', folder=folder, filename=f) }}">{{ f }}</a>
        </li>
      {% endfor %}
    </ul>
    <hr>
    <p>On your Mac, you can open this folder directly:</p>
    <p>
      <a href="file://{{ abs_path }}" target="_blank" class="btn btn-outline-secondary">
        Open in Finder
      </a>
    </p>
  </div>
</body>
</html>
